[project]
name = "la-ban-khkt"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
# Đồng bộ danh sách runtime với requirements.txt để bộ cài của Vercel
# đọc pyproject.toml cũng nhận đủ thư viện.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "google-auth[cryptography]>=2.38,<3",
    "requests>=2.32,<3",
    "pydantic>=2.10,<3",
]

[tool.vercel]
entrypoint = "app:app"
